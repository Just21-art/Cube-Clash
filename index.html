<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cube Clash v1.3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#1a1a2e; font-family:Arial,sans-serif; }
  canvas { display:block; width:100%; height:100%; background:linear-gradient(180deg,#16213e 0%,#0f3460 100%); }

  .screen {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; padding:20px;
    background:rgba(26,26,46,0.97); z-index:20;
  }
  .hidden { display:none !important; }

  h1 { font-size:48px; color:#ffd700; letter-spacing:3px; margin-bottom:6px; text-shadow:0 0 30px rgba(255,215,0,0.8); }
  .subtitle { color:#ffd700; opacity:0.85; font-size:15px; margin-bottom:8px; }
  .record { color:#10b981; font-size:16px; margin-bottom:20px; font-weight:bold; }

  .colors { display:flex; gap:14px; margin-bottom:25px; }
  .color-btn { width:52px; height:52px; border-radius:12px; border:3px solid transparent; cursor:pointer; transition:0.2s; }
  .color-btn.selected { border-color:#fff; transform:scale(1.15); box-shadow:0 0 22px currentColor; }

  .menu-buttons { display:flex; flex-direction:column; gap:12px; width:80%; max-width:300px; }
  .menu-btn { padding:15px; font-size:20px; background:#ffd700; color:#1a1a2e; border:none; border-radius:15px; font-weight:bold; cursor:pointer; transition:0.2s; }
  .menu-btn:active { transform:scale(0.95); }
  .menu-btn.secondary { background:#0f3460; color:#fff; }

  .level-buttons { display:flex; flex-direction:column; gap:15px; width:80%; max-width:300px; margin-bottom:20px; }
  .level-btn { padding:20px; font-size:22px; background:#1e293b; color:#fff; border:2px solid #4dabf7; border-radius:15px; font-weight:bold; cursor:pointer; transition:0.2s; }
  .level-btn:active { transform:scale(0.95); background:#4dabf7; color:#1a1a2e; }
  .level-btn span { display:block; font-size:14px; color:#888; margin-top:5px; font-weight:normal; }
  .level-btn:active span { color:#1a1a2e; }

  .back-btn { padding:12px 25px; font-size:16px; background:#e94560; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
  .back-btn:active { transform:scale(0.95); }

  #hud { position:fixed; top:15px; left:0; width:100%; text-align:center; color:#ffd700; font-size:20px; font-weight:bold; pointer-events:none; z-index:5; text-shadow:0 0 10px rgba(255,215,0,0.7); }
  #hud .best { color:#888; font-size:13px; margin-top:4px; }
  #hud .level { color:#4dabf7; font-size:15px; margin-top:4px; }

  #pauseBtn { position:fixed; top:15px; right:15px; background:rgba(255,215,0,0.9); color:#1a1a2e; border:none; border-radius:10px; padding:8px 14px; font-size:16px; font-weight:bold; cursor:pointer; z-index:6; }

  .version { position:fixed; bottom:12px; right:12px; color:#ffd700; font-size:12px; opacity:0.6; font-weight:bold; z-index:5; }

  #gameover h2 { color:#e94560; font-size:34px; margin-bottom:12px; }
  #gameover p { font-size:20px; margin-bottom:8px; }
  #gameover .best-text { color:#ffd700; margin-bottom:22px; }

  #levelup h2 { color:#10b981; font-size:34px; margin-bottom:20px; }
  #levelup p { font-size:18px; margin-bottom:25px; }

  .btn-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn-row button { padding:12px 22px; font-size:16px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
  .btn-again { background:#ffd700; color:#1a1a2e; }
  .btn-menu { background:#0f3460; color:#fff; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  Очки: <span id="score">0</span> / <span id="target">15</span>
  <div class="level">Уровень: <span id="level">1</span> / 3</div>
  <div class="best">Рекорд: <span id="best">0</span></div>
</div>

<button id="pauseBtn" class="hidden">⏸</button>
<div class="version hidden" id="verLabel">v1.3</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu" class="screen">
  <h1>CUBE CLASH</h1>
  <p class="subtitle">🎮 Версия 1.3</p>
  <p class="record">🏆 Рекорд: <span id="menuBest">0</span></p>
  
  <p style="color:#ffd700;font-size:16px;margin-bottom:12px;">Выбери персонажа:</p>
  <div class="colors">
    <div class="color-btn selected" style="background:#ffd700;color:#ffd700" data-color="0"></div>
    <div class="color-btn" style="background:#e94560;color:#e94560" data-color="1"></div>
    <div class="color-btn" style="background:#4dabf7;color:#4dabf7" data-color="2"></div>
    <div class="color-btn" style="background:#51cf66;color:#51cf66" data-color="3"></div>
  </div>

  <div class="menu-buttons">
    <button class="menu-btn" id="playBtn">▶ ИГРАТЬ (с 1 уровня)</button>
    <button class="menu-btn secondary" id="levelsBtn">📋 УРОВНИ</button>
  </div>
</div>

<!-- ВЫБОР УРОВНЯ -->
<div id="levelsScreen" class="screen hidden">
  <h1 style="font-size:36px;margin-bottom:30px;">📋 ВЫБОР УРОВНЯ</h1>
  
  <div class="level-buttons">
    <button class="level-btn" data-level="0">
      Уровень 1
      <span>Цель: 15 очков • Скорость: низкая</span>
    </button>
    <button class="level-btn" data-level="1">
      Уровень 2
      <span>Цель: 30 очков • Скорость: средняя</span>
    </button>
    <button class="level-btn" data-level="2">
      Уровень 3
      <span>Цель: 50 очков • Скорость: высокая</span>
    </button>
  </div>

  <button class="back-btn" id="backToMenuBtn">◀ Назад в меню</button>
</div>

<!-- ПАУЗА -->
<div id="pauseScreen" class="screen hidden">
  <h2 style="color:#ffd700;font-size:34px;margin-bottom:25px;">⏸ Пауза</h2>
  <div class="btn-row">
    <button class="btn-again" id="resumeBtn">▶ Продолжить</button>
    <button class="btn-menu" id="pauseMenuBtn">🏠 В меню</button>
  </div>
</div>

<!-- УРОВЕНЬ ПРОЙДЕН -->
<div id="levelup" class="screen hidden">
  <h2>🎉 Уровень пройден!</h2>
  <p>Готов к следующему?</p>
  <div class="btn-row">
    <button class="btn-again" id="nextLevelBtn">▶ Дальше</button>
    <button class="btn-menu" id="levelUpMenuBtn">📋 К уровням</button>
  </div>
</div>

<!-- ПОБЕДА -->
<div id="victory" class="screen hidden">
  <h2 style="color:#ffd700;font-size:38px;margin-bottom:20px;">🏆 ТЫ ПРОШЁЛ ИГРУ!</h2>
  <p style="font-size:20px;margin-bottom:25px;">Ты настоящий мастер Cube Clash!</p>
  <button class="btn-again" id="victoryMenuBtn">🏠 В меню</button>
</div>

<!-- ПРОИГРЫШ -->
<div id="gameover" class="screen hidden">
  <h2>💥 Игра окончена!</h2>
  <p>Уровень: <span id="finalLevel">1</span></p>
  <p>Очки: <span id="finalScore">0</span></p>
  <p class="best-text">🏆 Рекорд: <span id="bestScore">0</span></p>
  <div class="btn-row">
    <button class="btn-again" id="againBtn">🔄 Заново</button>
    <button class="btn-menu" id="menuBtn">🏠 Меню</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var COLORS = ["#ffd700", "#e94560", "#4dabf7", "#51cf66"];
  var selectedColor = 0;

  var W, H, groundY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    groundY = H - 80;
  }
  resize();
  window.addEventListener("resize", resize);

  var player, obstacles, score, speed, gameOver, paused;
  var gravity = 0.8, jumpPower = -15, spawnTimer, bestScore, rafId;
  var audioCtx = null;

  var LEVELS = [
    { target: 15, speed: 5,   spawnBase: 55 },
    { target: 30, speed: 6.5, spawnBase: 45 },
    { target: 50, speed: 8,   spawnBase: 35 }
  ];
  var currentLevel = 0;

  bestScore = parseInt(localStorage.getItem("cubeBest") || "0", 10) || 0;
  document.getElementById("menuBest").textContent = bestScore;

  function beep(freq, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.value = freq;
      o.type = "square";
      g.gain.value = 0.05;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  function init(levelIndex) {
    currentLevel = levelIndex || 0;
    groundY = H - 80;
    player = { x:80, y:groundY-40, size:40, vy:0, onGround:true };
    obstacles = [];
    score = 0;
    speed = LEVELS[currentLevel].speed;
    gameOver = false;
    paused = false;
    spawnTimer = 0;
    document.getElementById("score").textContent = "0";
    document.getElementById("target").textContent = LEVELS[currentLevel].target;
    document.getElementById("level").textContent = currentLevel + 1;
    document.getElementById("best").textContent = bestScore;
  }

  function showScreen(id) {
    ["menu", "levelsScreen", "pauseScreen", "levelup", "victory", "gameover"].forEach(function(s) {
      var el = document.getElementById(s);
      if (el) el.classList.add("hidden");
    });
    if (id) {
      document.getElementById(id).classList.remove("hidden");
    }
  }

  function startGame(levelIndex) {
    showScreen(null);
    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    document.getElementById("verLabel").classList.remove("hidden");
    resize();
    init(levelIndex);
    if (rafId) cancelAnimationFrame(rafId);
    loop();
  }

  function showMenu() {
    showScreen("menu");
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("verLabel").classList.add("hidden");
    document.getElementById("menuBest").textContent = bestScore;
    gameOver = true;
    paused = true;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function showLevels() {
    showScreen("levelsScreen");
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("verLabel").classList.add("hidden");
    gameOver = true;
    paused = true;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function togglePause() {
    if (gameOver) return;
    if (paused) {
      paused = false;
      document.getElementById("pauseScreen").classList.add("hidden");
      loop();
    } else {
      paused = true;
      document.getElementById("pauseScreen").classList.remove("hidden");
    }
  }

  function jump() {
    if (gameOver || paused || !player) return;
    if (player.onGround) {
      player.vy = jumpPower;
      player.onGround = false;
      beep(700, 0.06);
    }
  }

  function spawnObstacle() {
    var type = Math.random() < 0.6 ? "square" : "spike";
    var size = 30 + Math.random() * 30;
    obstacles.push({
      x: W + 50,
      y: groundY - size,
      w: type === "spike" ? size * 0.8 : size,
      h: size,
      type: type
    });
  }

  function nextLevel() {
    if (currentLevel + 1 >= LEVELS.length) {
      showScreen("victory");
      document.getElementById("pauseBtn").classList.add("hidden");
      gameOver = true;
      return;
    }
    startGame(currentLevel + 1);
  }

  function levelUp() {
    paused = true;
    document.getElementById("pauseBtn").classList.add("hidden");
    showScreen("levelup");
  }

  function update() {
    if (gameOver || paused) return;

    player.vy += gravity;
    player.y += player.vy;

    if (player.y >= groundY - player.size) {
      player.y = groundY - player.size;
      player.vy = 0;
      player.onGround = true;
    }

    var cfg = LEVELS[currentLevel];
    spawnTimer++;
    if (spawnTimer > cfg.spawnBase + Math.random() * 35) {
      spawnObstacle();
      spawnTimer = 0;
    }

    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= speed;

      if (player.x < o.x + o.w &&
          player.x + player.size > o.x &&
          player.y < o.y + o.h &&
          player.y + player.size > o.y) {
        beep(200, 0.2);
        endGame();
        return;
      }

      if (o.x + o.w < 0) {
        obstacles.splice(i, 1);
        score++;
        document.getElementById("score").textContent = score;
        
        if (score >= cfg.target) {
          levelUp();
          return;
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#0f3460";
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    var c = COLORS[selectedColor];
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.shadowBlur = 20;
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.shadowBlur = 0;

    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      ctx.fillStyle = "#e94560";
      ctx.shadowColor = "#e94560";
      ctx.shadowBlur = 15;

      if (o.type === "spike") {
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
    }
    ctx.shadowBlur = 0;
  }

  function endGame() {
    gameOver = true;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalLevel").textContent = currentLevel + 1;

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem("cubeBest", bestScore);
    }

    document.getElementById("bestScore").textContent = bestScore;
    document.getElementById("pauseBtn").classList.add("hidden");
    showScreen("gameover");
  }

  function loop() {
    if (gameOver || paused) return;
    update();
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // --- Кнопки ---
  document.getElementById("playBtn").addEventListener("click", function() {
    startGame(0);
  });

  document.getElementById("levelsBtn").addEventListener("click", showLevels);
  document.getElementById("backToMenuBtn").addEventListener("click", showMenu);

  var levelBtns = document.querySelectorAll(".level-btn");
  for (var i = 0; i < levelBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        var lvl = parseInt(btn.getAttribute("data-level"), 10);
        startGame(lvl);
      });
    })(levelBtns[i]);
  }

  document.getElementById("againBtn").addEventListener("click", function() {
    startGame(currentLevel);
  });
  document.getElementById("menuBtn").addEventListener("click", showMenu);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  document.getElementById("resumeBtn").addEventListener("click", togglePause);
  document.getElementById("pauseMenuBtn").addEventListener("click", showMenu);
  document.getElementById("nextLevelBtn").addEventListener("click", nextLevel);
  document.getElementById("levelUpMenuBtn").addEventListener("click", showLevels);
  document.getElementById("victoryMenuBtn").addEventListener("click", showMenu);

  var colorBtns = document.querySelectorAll(".color-btn");
  for (var i = 0; i < colorBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        selectedColor = parseInt(btn.getAttribute("data-color"), 10);
        for (var j = 0; j < colorBtns.length; j++) colorBtns[j].classList.remove("selected");
        btn.classList.add("selected");
      });
    })(colorBtns[i]);
  }

  canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    jump();
  }, { passive: false });
  canvas.addEventListener("mousedown", jump);

  document.addEventListener("keydown", function(e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (!document.getElementById("menu").classList.contains("hidden")) {
        startGame(0);
      } else if (!document.getElementById("gameover").classList.contains("hidden")) {
        startGame(currentLevel);
      } else if (!document.getElementById("pauseScreen").classList.contains("hidden")) {
        togglePause();
      } else if (!document.getElementById("levelup").classList.contains("hidden")) {
        nextLevel();
      } else {
        jump();
      }
    }
  });

  resize();
  init(0);
})();
</script>
</body>
 </html>
