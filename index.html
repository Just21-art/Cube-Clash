<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Mini</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            touch-action: none;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255,215,0,0.7);
        }
        #gameover {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            display: none;
            border: 3px solid #ffd700;
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        #gameover h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 32px;
        }
        #gameover p {
            margin-bottom: 20px;
            font-size: 18px;
        }
        #gameover button {
            padding: 12px 30px;
            font-size: 18px;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        #gameover button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui">Очки: <span id="score">0</span></div>
    <canvas id="game"></canvas>
    <div id="gameover">
        <h2>💥 Игра окончена!</h2>
        <p>Твой результат: <span id="finalScore">0</span></p>
        <button onclick="restart()">🔄 Заново</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let player, obstacles, score, speed, gameOver, gravity, jumpPower, groundY;

        function init() {
            groundY = H - 80;
            player = {
                x: 80,
                y: groundY - 40,
                size: 40,
                vy: 0,
                onGround: true
            };
            obstacles = [];
            score = 0;
            speed = 5;
            gameOver = false;
            gravity = 0.8;
            jumpPower = -15;
            document.getElementById("gameover").style.display = "none";
            document.getElementById("score").textContent = "0";
        }

        function jump() {
            if (gameOver) return;
            if (player.onGround) {
                player.vy = jumpPower;
                player.onGround = false;
            }
        }

        document.addEventListener("touchstart", function(e) {
            e.preventDefault();
            jump();
        }, { passive: false });
        document.addEventListener("mousedown", jump);
        document.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                jump();
            }
        });

        function spawnObstacle() {
            let size = 30 + Math.random() * 30;
            obstacles.push({
                x: W + 50,
                y: groundY - size,
                w: size,
                h: size
            });
        }

        let spawnTimer = 0;

        function update() {
            if (gameOver) return;

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.size) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.onGround = true;
            }

            spawnTimer++;
            if (spawnTimer > 60 + Math.random() * 40) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= speed;

                if (
                    player.x < o.x + o.w &&
                    player.x + player.size > o.x &&
                    player.y < o.y + o.h &&
                    player.y + player.size > o.y
                ) {
                    endGame();
                }

                if (o.x + o.w < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById("score").textContent = score;
                    if (score % 5 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, groundY, W, H - groundY);
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(W, groundY);
            ctx.stroke();

            ctx.fillStyle = "#ffd700";
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 20;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#e94560";
            ctx.shadowColor = "#e94560";
            ctx.shadowBlur = 15;
            for (let o of obstacles) {
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
            ctx.shadowBlur = 0;
        }

        function endGame() {
            gameOver = true;
            document.getElementById("finalScore").textContent = score;
            document.getElementById("gameover").style.display = "block";
        }

        function restart() {
            init();
            loop();
        }

        function loop() {
            if (!gameOver) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }

        init();
        loop();
    </script>
</body>
  </html>
