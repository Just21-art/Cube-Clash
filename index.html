<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cube Clash v1.4 Halloween</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { overflow:hidden; background:#1a1a2e; font-family:Arial,sans-serif; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  
  .screen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(135deg, #1a0a1a 0%, #0a0a0a 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; z-index:20; padding: 20px;
  }
  .hidden { display:none !important; }

  h1 { font-size:48px; color:#ffd700; letter-spacing:3px; margin-bottom:6px; text-shadow:0 0 30px rgba(255,215,0,0.8); }
  .subtitle { color:#ffd700; opacity:0.85; font-size:15px; margin-bottom:8px; }
  .record { color:#10b981; font-size:16px; margin-bottom:15px; font-weight:bold; }
  .label { color:#ffd700; font-size:16px; margin-bottom:10px; }

  .colors { display:flex; gap:14px; margin-bottom:15px; }
  .color-btn { width:50px; height:50px; border-radius:12px; border:3px solid transparent; cursor:pointer; transition:0.2s; }
  .color-btn.selected { border-color:#fff; transform:scale(1.15); box-shadow:0 0 22px currentColor; }

  /* Стиль для Тыквы */
  .pumpkin-btn {
    width: 60px; height: 60px; background: #ff8c00; border-radius: 15px;
    position: relative; cursor: pointer; border: 3px solid transparent;
    margin-bottom: 15px; transition: 0.2s; box-shadow: 0 0 20px rgba(255,140,0,0.6);
  }
  .pumpkin-btn.selected { border-color: #fff; transform: scale(1.1); }
  .pumpkin-btn::before {
    content: ''; position: absolute; top: 15px; left: 12px; width: 10px; height: 10px; background: #000; border-radius: 2px; box-shadow: 26px 0 0 #000;
  }
  .pumpkin-btn::after {
    content: ''; position: absolute; bottom: 12px; left: 15px; width: 30px; height: 12px; background: #000;
    clip-path: polygon(0% 0%, 20% 100%, 40% 0%, 60% 100%, 80% 0%, 100% 100%, 100% 0%);
  }

  .play-btn { padding:15px 30px; font-size:20px; background:#ffd700; color:#1a1a2e; border:none; border-radius:15px; font-weight:bold; cursor:pointer; margin-bottom:10px; width:100%; max-width:300px; }
  .play-btn:active { transform:scale(0.95); }
  .halloween-btn { background:#ff8c00; color:#fff; border:2px solid #6a0dad; box-shadow:0 0 15px rgba(255,140,0,0.5); }
  .secondary-btn { background:#0f3460; color:#fff; border:2px solid #4dabf7; }

  /* Выбор уровня */
  .level-btn { padding:20px; font-size:22px; background:#1e293b; color:#fff; border:2px solid #4dabf7; border-radius:15px; font-weight:bold; cursor:pointer; width:100%; max-width:300px; margin-bottom:15px; }
  .level-btn:active { background:#4dabf7; color:#1a1a2e; }
  .level-btn span { display:block; font-size:14px; color:#888; margin-top:5px; font-weight:normal; }

  #hud { position:fixed; top:15px; left:0; width:100%; text-align:center; color:#ffd700; font-size:20px; font-weight:bold; pointer-events:none; z-index:5; text-shadow:0 0 10px rgba(255,215,0,0.7); }
  #hud .best { color:#888; font-size:13px; margin-top:4px; }

  #pauseBtn { position:fixed; top:15px; right:15px; background:rgba(255,215,0,0.9); color:#1a1a2e; border:none; border-radius:10px; padding:8px 14px; font-size:16px; font-weight:bold; cursor:pointer; z-index:6; }

  .version { position:fixed; bottom:12px; right:12px; color:#ffd700; font-size:12px; opacity:0.6; font-weight:bold; z-index:5; }

  #gameover h2 { color:#e94560; font-size:34px; margin-bottom:12px; }
  #gameover p { font-size:20px; margin-bottom:8px; }
  #gameover .best-text { color:#ffd700; margin-bottom:22px; }

  .btn-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn-row button { padding:12px 22px; font-size:16px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
  .btn-again { background:#ffd700; color:#1a1a2e; }
  .btn-menu { background:#0f3460; color:#fff; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  Очки: <span id="score">0</span>
  <div class="best">Рекорд: <span id="best">0</span></div>
</div>

<button id="pauseBtn" class="hidden">⏸</button>
<div class="version hidden" id="verLabel">v1.4</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu" class="screen">
  <h1>CUBE CLASH</h1>
  <p class="subtitle">🎮 Версия 1.4 (Хэллоуин)</p>
  <p class="record">🏆 Рекорд: <span id="menuBest">0</span></p>
  
  <p class="label">Выбери персонажа:</p>
  <div class="colors">
    <div class="color-btn selected" style="background:#ffd700;color:#ffd700" data-color="0"></div>
    <div class="color-btn" style="background:#e94560;color:#e94560" data-color="1"></div>
    <div class="color-btn" style="background:#4dabf7;color:#4dabf7" data-color="2"></div>
    <div class="color-btn" style="background:#51cf66;color:#51cf66" data-color="3"></div>
  </div>
  
  <div class="pumpkin-btn" id="pumpkinBtn" data-color="4"></div>
  <p class="label" style="font-size:12px; margin-top:-10px; margin-bottom:15px; color:#aaa;">Тыква (Хэллоуин)</p>

  <button class="play-btn" id="playBtn">▶ ИГРАТЬ (с 1 уровня)</button>
  <button class="play-btn secondary-btn" id="levelsBtn">📋 УРОВНИ</button>
  <button class="play-btn halloween-btn" id="halloweenBtn">🎃 ИГРАТЬ В ХЭЛЛОУИН</button>
</div>

<!-- ВЫБОР УРОВНЯ -->
<div id="levelsScreen" class="screen hidden">
  <h1 style="font-size:36px; margin-bottom:30px;">📋 ВЫБОР УРОВНЯ</h1>
  <button class="level-btn" data-level="0">Уровень 1<span>Цель: 15 очков • Низкая скорость</span></button>
  <button class="level-btn" data-level="1">Уровень 2<span>Цель: 30 очков • Средняя скорость</span></button>
  <button class="level-btn" data-level="2">Уровень 3<span>Цель: 50 очков • Высокая скорость</span></button>
  <button class="btn-menu" id="backToMenuBtn" style="margin-top:20px; padding:12px 25px;">◀ Назад в меню</button>
</div>

<!-- ПАУЗА -->
<div id="pauseScreen" class="screen hidden">
  <h2 style="color:#ffd700;font-size:34px;margin-bottom:25px;">⏸ Пауза</h2>
  <div class="btn-row">
    <button class="btn-again" id="resumeBtn">▶ Продолжить</button>
    <button class="btn-menu" id="pauseMenuBtn">🏠 В меню</button>
  </div>
</div>

<!-- КОНЕЦ ИГРЫ -->
<div id="gameover" class="screen hidden">
  <h2>💥 Игра окончена!</h2>
  <p>Твой результат: <span id="finalScore">0</span></p>
  <p class="best-text">🏆 Рекорд: <span id="bestScore">0</span></p>
  <div class="btn-row">
    <button class="btn-again" id="againBtn">🔄 Заново</button>
    <button class="btn-menu" id="menuBtn">🏠 Меню</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var COLORS = ["#ffd700", "#e94560", "#4dabf7", "#51cf66", "#ff8c00"]; 
  var selectedColor = 0;

  var W, H, groundY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    groundY = H - 80;
  }
  resize();
  window.addEventListener("resize", resize);

  // Физика (сделана плавнее, как в 1.3)
  var player, obstacles, score, speed, gameOver, paused;
  var gravity = 0.6, jumpPower = -14, spawnTimer, bestScore, rafId;
  var audioCtx = null;
  var isHalloweenMode = false;

  // Уровни
  var LEVELS = [
    { target: 15, speed: 5,   spawnBase: 55 },
    { target: 30, speed: 6.5, spawnBase: 45 },
    { target: 50, speed: 8,   spawnBase: 35 }
  ];
  var currentLevel = 0;

  bestScore = parseInt(localStorage.getItem("cubeBest") || "0", 10) || 0;
  document.getElementById("menuBest").textContent = bestScore;

  function beep(freq, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.value = freq;
      o.type = "square";
      g.gain.value = 0.05;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  function init(levelIndex) {
    currentLevel = levelIndex || 0;
    groundY = H - 80;
    player = { x:80, y:groundY-40, size:40, vy:0, onGround:true };
    obstacles = [];
    score = 0;
    speed = LEVELS[currentLevel].speed;
    gameOver = false;
    paused = false;
    spawnTimer = 0;
    document.getElementById("score").textContent = "0";
    document.getElementById("best").textContent = bestScore;
  }

  function showScreen(id) {
    ["menu", "levelsScreen", "pauseScreen", "gameover"].forEach(function(s) {
      var el = document.getElementById(s);
      if (el) el.classList.add("hidden");
    });
    if (id) document.getElementById(id).classList.remove("hidden");
  }

  function startGame(isHalloween, levelIndex) {
    isHalloweenMode = isHalloween;
    showScreen(null);
    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("pauseBtn").classList.remove("hidden");
    document.getElementById("verLabel").classList.remove("hidden");
    resize();
    init(levelIndex);
    if (rafId) cancelAnimationFrame(rafId);
    loop();
  }

  function showMenu() {
    showScreen("menu");
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("verLabel").classList.add("hidden");
    document.getElementById("menuBest").textContent = bestScore;
    gameOver = true;
    paused = true;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function showLevels() {
    showScreen("levelsScreen");
    document.getElementById("hud").classList.add("hidden");
    document.getElementById("pauseBtn").classList.add("hidden");
    document.getElementById("verLabel").classList.add("hidden");
    gameOver = true;
    paused = true;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function togglePause() {
    if (gameOver) return;
    if (paused) {
      paused = false;
      document.getElementById("pauseScreen").classList.add("hidden");
      loop();
    } else {
      paused = true;
      document.getElementById("pauseScreen").classList.remove("hidden");
    }
  }

  function jump() {
    if (gameOver || paused || !player) return;
    if (player.onGround) {
      player.vy = jumpPower;
      player.onGround = false;
      beep(700, 0.06);
    }
  }

  function spawnObstacle() {
    var type = Math.random() < 0.6 ? "square" : "spike";
    var size = 30 + Math.random() * 30;
    obstacles.push({
      x: W + 50,
      y: groundY - size,
      w: type === "spike" ? size * 0.8 : size,
      h: size,
      type: type
    });
  }

  function update() {
    if (gameOver || paused) return;

    player.vy += gravity;
    player.y += player.vy;

    if (player.y >= groundY - player.size) {
      player.y = groundY - player.size;
      player.vy = 0;
      player.onGround = true;
    }

    var cfg = LEVELS[currentLevel];
    spawnTimer++;
    if (spawnTimer > cfg.spawnBase + Math.random() * 35) {
      spawnObstacle();
      spawnTimer = 0;
    }

    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= speed;

      if (player.x < o.x + o.w &&
          player.x + player.size > o.x &&
          player.y < o.y + o.h &&
          player.y + player.size > o.y) {
        beep(200, 0.2);
        endGame();
        return;
      }

      if (o.x + o.w < 0) {
        obstacles.splice(i, 1);
        score++;
        document.getElementById("score").textContent = score + " / " + cfg.target;
        if (score % 5 === 0) speed += 0.3; // Плавное ускорение
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Фон
    if (isHalloweenMode) {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#2a0a2a"); grad.addColorStop(1, "#0a0a0a");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    } else {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#16213e"); grad.addColorStop(1, "#0f3460");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    }

    // Земля
    ctx.fillStyle = isHalloweenMode ? "#ff8c00" : "#0f3460";
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = isHalloweenMode ? "#6a0dad" : "#ffd700";
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    // Игрок
    var c = COLORS[selectedColor];
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 20;
    
    if (selectedColor === 4) {
        ctx.fillRect(player.x, player.y, player.size, player.size);
        ctx.fillStyle = "#000";
        ctx.fillRect(player.x + 8, player.y + 10, 8, 8);
        ctx.fillRect(player.x + 24, player.y + 10, 8, 8);
        ctx.beginPath();
        ctx.moveTo(player.x + 10, player.y + 28); ctx.lineTo(player.x + 15, player.y + 22);
        ctx.lineTo(player.x + 20, player.y + 28); ctx.lineTo(player.x + 25, player.y + 22);
        ctx.lineTo(player.x + 30, player.y + 28); ctx.lineTo(player.x + 30, player.y + 32);
        ctx.lineTo(player.x + 10, player.y + 32); ctx.closePath(); ctx.fill();
    } else {
        ctx.fillRect(player.x, player.y, player.size, player.size);
    }
    ctx.shadowBlur = 0;

    // Препятствия
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (isHalloweenMode && o.type === "square") {
          ctx.fillStyle = "#888"; ctx.shadowColor = "#888"; ctx.shadowBlur = 10;
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.beginPath(); ctx.arc(o.x + o.w/2, o.y, o.w/2, Math.PI, 0); ctx.fill();
      } else {
          ctx.fillStyle = "#e94560"; ctx.shadowColor = "#e94560"; ctx.shadowBlur = 15;
          if (o.type === "spike") {
            ctx.beginPath(); ctx.moveTo(o.x, o.y + o.h); ctx.lineTo(o.x + o.w / 2, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.closePath(); ctx.fill();
          } else {
            ctx.fillRect(o.x, o.y, o.w, o.h);
          }
      }
    }
    ctx.shadowBlur = 0;
  }

  function endGame() {
    gameOver = true;
    document.getElementById("finalScore").textContent = score;
    if (score > bestScore) { bestScore = score; localStorage.setItem("cubeBest", bestScore); }
    document.getElementById("bestScore").textContent = bestScore;
    document.getElementById("pauseBtn").classList.add("hidden");
    showScreen("gameover");
  }

  function loop() {
    if (gameOver || paused) return;
    update();
    draw();
    rafId = requestAnimationFrame(loop);
  }

  // --- КНОПКИ ---
  document.getElementById("playBtn").addEventListener("click", function() { startGame(false, 0); });
  document.getElementById("halloweenBtn").addEventListener("click", function() { startGame(true, 0); });
  document.getElementById("levelsBtn").addEventListener("click", showLevels);
  document.getElementById("backToMenuBtn").addEventListener("click", showMenu);
  
  var levelBtns = document.querySelectorAll(".level-btn");
  for (var i = 0; i < levelBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        var lvl = parseInt(btn.getAttribute("data-level"), 10);
        startGame(false, lvl); // Уровни запускают обычный режим
      });
    })(levelBtns[i]);
  }

  document.getElementById("againBtn").addEventListener("click", function() { startGame(isHalloweenMode, currentLevel); });
  document.getElementById("menuBtn").addEventListener("click", showMenu);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  document.getElementById("resumeBtn").addEventListener("click", togglePause);
  document.getElementById("pauseMenuBtn").addEventListener("click", showMenu);

  // Выбор цвета
  var colorBtns = document.querySelectorAll(".color-btn, .pumpkin-btn");
  for (var i = 0; i < colorBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        selectedColor = parseInt(btn.getAttribute("data-color"), 10);
        for (var j = 0; j < colorBtns.length; j++) colorBtns[j].classList.remove("selected");
        btn.classList.add("selected");
      });
    })(colorBtns[i]);
  }

  // Управление
  canvas.addEventListener("touchstart", function(e) { e.preventDefault(); jump(); }, { passive: false });
  canvas.addEventListener("mousedown", jump);

  resize();
  init(0);
})();
</script>
</body>
</html>
