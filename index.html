<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cube Clash v1.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            touch-action: none;
        }
        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #menu {
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        h1 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            letter-spacing: 3px;
        }
        .subtitle {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 16px;
            opacity: 0.8;
        }
        .section-title {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .colors {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .color-btn.selected {
            border-color: white;
            transform: scale(1.15);
            box-shadow: 0 0 20px currentColor;
        }
        .play-btn {
            padding: 15px 50px;
            font-size: 22px;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255,215,0,0.7);
            z-index: 5;
        }
        .best {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .version {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: #ffd700;
            font-size: 12px;
            opacity: 0.6;
            font-weight: bold;
        }
        #gameover {
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
            display: none;
        }
        #gameover h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 36px;
        }
        #gameover p {
            margin-bottom: 10px;
            font-size: 20px;
        }
        #gameover .best-text {
            color: #ffd700;
            margin-bottom: 25px;
        }
        .btn-row {
            display: flex;
            gap: 15px;
        }
        .btn-row button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-again { background: #ffd700; color: #1a1a2e; }
        .btn-menu { background: #0f3460; color: white; }
    </style>
</head>
<body>
    <div id="menu" class="screen">
        <h1>CUBE CLASH</h1>
        <p class="subtitle">🎮 Версия 1.1</p>
        <p class="section-title">Выбери персонажа:</p>
        <div class="colors">
            <div class="color-btn selected" style="background:#ffd700; color:#ffd700;" onclick="selectColor(0, this)"></div>
            <div class="color-btn" style="background:#e94560; color:#e94560;" onclick="selectColor(1, this)"></div>
            <div class="color-btn" style="background:#4dabf7; color:#4dabf7;" onclick="selectColor(2, this)"></div>
            <div class="color-btn" style="background:#51cf66; color:#51cf66;" onclick="selectColor(3, this)"></div>
        </div>
        <button class="play-btn" onclick="startGame()">▶ ИГРАТЬ</button>
    </div>

    <div id="ui" style="display:none;">
        Очки: <span id="score">0</span>
        <div class="best">Рекорд: <span id="best">0</span></div>
    </div>

    <canvas id="game"></canvas>

    <div class="version" id="versionLabel" style="display:none;">v1.1</div>

    <div id="gameover" class="screen">
        <h2>💥 Игра окончена!</h2>
        <p>Твой результат: <span id="finalScore">0</span></p>
        <p class="best-text">🏆 Рекорд: <span id="bestScore">0</span></p>
        <div class="btn-row">
            <button class="btn-again" onclick="startGame()">🔄 Заново</button>
            <button class="btn-menu" onclick="showMenu()">🏠 Меню</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const COLORS = ["#ffd700", "#e94560", "#4dabf7", "#51cf66"];
        let selectedColor = 0;

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let player, obstacles, score, speed, gameOver, gravity, jumpPower, groundY;
        let spawnTimer, bestScore;

        bestScore = parseInt(localStorage.getItem("cubeBest") || "0");

        function selectColor(i, el) {
            selectedColor = i;
            document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
            el.classList.add("selected");
        }

        function init() {
            groundY = H - 80;
            player = {
                x: 80,
                y: groundY - 40,
                size: 40,
                vy: 0,
                onGround: true
            };
            obstacles = [];
            score = 0;
            speed = 5;
            gameOver = false;
            gravity = 0.8;
            jumpPower = -15;
            spawnTimer = 0;
            document.getElementById("score").textContent = "0";
            document.getElementById("best").textContent = bestScore;
        }

        function startGame() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("gameover").style.display = "none";
            document.getElementById("ui").style.display = "block";
            document.getElementById("versionLabel").style.display = "block";
            init();
            loop();
        }

        function showMenu() {
            document.getElementById("menu").style.display = "flex";
            document.getElementById("gameover").style.display = "none";
            document.getElementById("ui").style.display = "none";
            document.getElementById("versionLabel").style.display = "none";
            gameOver = true;
        }

        function jump() {
            if (gameOver || !player) return;
            if (player.onGround) {
                player.vy = jumpPower;
                player.onGround = false;
            }
        }

        document.addEventListener("touchstart", function(e) {
            if (document.getElementById("menu").style.display !== "flex" &&
                document.getElementById("gameover").style.display !== "flex") {
                e.preventDefault();
                jump();
            }
        }, { passive: false });

        document.addEventListener("mousedown", function() {
            if (document.getElementById("menu").style.display !== "flex" &&
                document.getElementById("gameover").style.display !== "flex") {
                jump();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (document.getElementById("menu").style.display === "flex") {
                    startGame();
                } else if (document.getElementById("gameover").style.display === "flex") {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        function spawnObstacle() {
            let type = Math.random() < 0.6 ? "square" : "spike";
            let size = 30 + Math.random() * 30;
            obstacles.push({
                x: W + 50,
                y: groundY - size,
                w: type === "spike" ? size * 0.8 : size,
                h: size,
                type: type
            });
        }

        function update() {
            if (gameOver) return;

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.size) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.onGround = true;
            }

            spawnTimer++;
            if (spawnTimer > 55 + Math.random() * 35) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= speed;

                if (
                    player.x < o.x + o.w &&
                    player.x + player.size > o.x &&
                    player.y < o.y + o.h &&
                    player.y + player.size > o.y
                ) {
                    endGame();
                    return;
                }

                if (o.x + o.w < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById("score").textContent = score;
                    if (score % 5 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, groundY, W, H - groundY);
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(W, groundY);
            ctx.stroke();

            let c = COLORS[selectedColor];
            ctx.fillStyle = c;
            ctx.shadowColor = c;
            ctx.shadowBlur = 20;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;

            for (let o of obstacles) {
                ctx.fillStyle = "#e94560";
                ctx.shadowColor = "#e94560";
                ctx.shadowBlur = 15;

                if (o.type === "spike") {
                    ctx.beginPath();
                    ctx.moveTo(o.x, o.y + o.h);
                    ctx.lineTo(o.x + o.w / 2, o.y);
                    ctx.lineTo(o.x + o.w, o.y + o.h);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                }
            }
            ctx.shadowBlur = 0;
        }

        function endGame() {
            gameOver = true;
            document.getElementById("finalScore").textContent = score;

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("cubeBest", bestScore);
            }

            document.getElementById("bestScore").textContent = bestScore;
            document.getElementById("gameover").style.display = "flex";
        }

        function loop() {
            if (!gameOver) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }

        init();
    </script>
</body>
</html>
